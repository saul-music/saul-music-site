[project]
name = "saul-music-site"
version = "0.0.0"
description = "Sitio público de SAÚL música (Acordia)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "saul-music-render==0.6.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8",
    "pytest-playwright>=0.10.0",
    "ruff>=0.15",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "musicsite"

# Solo el índice público, más UN índice propio y explícito solo para la librería de render (R1):
# `acordia` en Artifact Registry. El token no va en el repo: UV_INDEX_ACORDIA_USERNAME y
# UV_INDEX_ACORDIA_PASSWORD (ver scripts/uv-acordia.sh y el CI).
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "acordia"
url = "https://southamerica-west1-python.pkg.dev/saulapp-music/acordia/simple/"
explicit = true

[tool.uv.sources]
saul-music-render = { index = "acordia" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Los e2e (Playwright) son lentos y piden navegadores: corren aparte con `-m e2e`.
addopts = "-m 'not e2e'"
markers = ["e2e: pruebas de navegador con Playwright (pytest -m e2e --browser chromium)"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/musicsite/profes.py" = ["E501"]
# HTML y SVG en cadenas (S65): partirlas haría más difícil leer qué se dibuja.
"src/musicsite/learn.py" = ["E501"]
"src/musicsite/learn_figures.py" = ["E501"]
