[project]
name = "saul-music-site"
version = "0.0.0"
description = "Sitio público de SAÚL música (Acordia)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8",
    "ruff>=0.15",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "musicsite"

# Solo el índice público: ningún índice privado ni configuración de la máquina.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Plantilla HTML: las líneas largas son atributos que no conviene partir.
"src/musicsite/songpages.py" = ["E501"]
"src/musicsite/profes.py" = ["E501"]
