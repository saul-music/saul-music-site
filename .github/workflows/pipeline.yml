name: pipeline

# Cada job tiene timeout-minutes (S32) para que un atasco de GitHub no deje colgado el pipeline.
# Un solo pipeline, secuencial (D45 de saul): ci (lint y tests) -> e2e (navegadores, en matriz)
# (S48: el e2e se salta si el cambio solo sube la librería de render o toca documentación; ver
# scripts/necesita-e2e.sh. Las etapas siguientes aceptan un e2e saltado, nunca uno fallido.
# S49: el e2e corre solo en los PR, con Chromium e iPhone 14; al mezclar a main no se repite.
# Firefox, WebKit de escritorio y Pixel 7, y todos contra producción: scripts/e2e-produccion.sh, en local)
# -> image (build amd64 + smoke)
# -> publish (imagen a Artifact Registry) -> deploy (sitio en Cloud Run).
# publish y deploy solo corren en main; los PR terminan en image. Todo lo que necesitan en GCP
# lo crea bootstrap/gcp.sh (D56). Sin llaves JSON: WIF restringido a este repo y a main.
on:
  pull_request:
    paths-ignore: ["**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_ID: saulapp-music
  REGION: southamerica-west1
  IMAGE: southamerica-west1-docker.pkg.dev/saulapp-music/musicsite/musicsite
  SERVICE: musicsite
  DEPLOYER: musicsite-deployer@saulapp-music.iam.gserviceaccount.com
  RUNTIME: musicsite-runtime@saulapp-music.iam.gserviceaccount.com
  EDITORIAL_BUCKET: saulapp-music-editorial
  RENDER_READER: render-reader@saulapp-music.iam.gserviceaccount.com

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: lint y tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # La librería de render (R1) vive en Artifact Registry: se lee con `render-reader` por WIF.
    permissions:
      contents: read
      id-token: write
    outputs:
      e2e: ${{ steps.cambios.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # el historial, para comparar con la base del cambio (S48)
      - name: ¿hace falta el e2e? (S48)
        id: cambios
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$EVENT" in
            pull_request) e2e="$(scripts/necesita-e2e.sh "origin/${BASE_REF}...HEAD")" ;;
            push) e2e=false ;;  # S49: el PR ya lo corrió sobre este código; tras desplegar, e2e-produccion.sh
            *) e2e=true ;;  # a mano (workflow_dispatch): siempre con navegadores
          esac
          echo "e2e=${e2e}" >> "$GITHUB_OUTPUT"
          echo "e2e: ${e2e}"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: render
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_RENDER_READER }}
          service_account: ${{ env.RENDER_READER }}
          token_format: access_token
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
        env:
          UV_INDEX_ACORDIA_USERNAME: oauth2accesstoken
          UV_INDEX_ACORDIA_PASSWORD: ${{ steps.render.outputs.access_token }}
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  e2e:
    # Matriz dentro de una etapa independiente (D45): cada entrada es un navegador, con o sin
    # emulación de celular. Una falla en cualquiera detiene el pipeline antes de la imagen.
    name: e2e ${{ matrix.browser }}${{ matrix.device && format(' / {0}', matrix.device) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ci]
    if: needs.ci.outputs.e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # S49: dos en el CI (el de escritorio más usado y el iPhone, el más delicado con el audio);
          # los otros tres, en local con scripts/e2e-produccion.sh.
          - { browser: chromium }
          - { browser: webkit, device: iPhone 14 }
    # La librería de render (R1) vive en Artifact Registry: se lee con `render-reader` por WIF.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: render
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_RENDER_READER }}
          service_account: ${{ env.RENDER_READER }}
          token_format: access_token
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
        env:
          UV_INDEX_ACORDIA_USERNAME: oauth2accesstoken
          UV_INDEX_ACORDIA_PASSWORD: ${{ steps.render.outputs.access_token }}
      - name: instalar el navegador (S49; apt se cuelga a veces en el runner)
        # Hasta 3 intentos de 4 minutos: un cuelgue cuesta minutos, no los 20 del tope del job.
        timeout-minutes: 13
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          for i in 1 2 3; do
            timeout -k 10 240 uv run playwright install --with-deps "$BROWSER" && exit 0
            echo "::warning::instalación de $BROWSER colgada o fallida (intento $i)"
            sudo pkill -9 -f 'apt-get|dpkg' || true
            sudo dpkg --configure -a || true
          done
          exit 1
      - name: pruebas de navegador
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          set -- -m e2e --browser "${{ matrix.browser }}" --tracing retain-on-failure --output test-results
          if [ -n "$DEVICE" ]; then set -- "$@" --device "$DEVICE"; fi
          uv run pytest "$@"
      - name: traza de las fallas
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trace-${{ matrix.browser }}-${{ strategy.job-index }}
          path: test-results
          retention-days: 7

  image:
    name: imagen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ci, e2e]
    # Sigue con el e2e en verde o saltado (S48); nunca con uno fallido o cancelado.
    if: >-
      !cancelled() && needs.ci.result == 'success' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: render
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_RENDER_READER }}
          service_account: ${{ env.RENDER_READER }}
          token_format: access_token
      - name: construir
        env:
          ACORDIA_TOKEN: ${{ steps.render.outputs.access_token }}
        run: docker build --platform linux/amd64 --secret id=acordia_token,env=ACORDIA_TOKEN -t saul-music-site:ci .
      - name: smoke (la imagen sirve el sitio y /docs es 404)
        run: |
          docker run -d --rm --name site -p 8080:8080 saul-music-site:ci
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:8080/ && break
            sleep 1
          done
          code() { curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$1"; }
          test "$(code /)" = "200"
          test "$(code /cancion.html)" = "200"
          test "$(code /cancion-otra-era.html)" = "200"
          test "$(code /docs)" = "404"
          docker stop site

  publish:
    name: publicar imagen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [image]
    if: >-
      !cancelled() && needs.image.result == 'success' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Primero el token de lectura de la librería; después el deployer, que es el que usa gcloud.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: render
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_RENDER_READER }}
          service_account: ${{ env.RENDER_READER }}
          token_format: access_token
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: construir y subir (tag = git sha, nunca latest)
        env:
          ACORDIA_TOKEN: ${{ steps.render.outputs.access_token }}
        run: |
          docker build --platform linux/amd64 --secret id=acordia_token,env=ACORDIA_TOKEN \
            -t "${IMAGE}:${GITHUB_SHA}" .
          docker push "${IMAGE}:${GITHUB_SHA}"

  deploy:
    name: desplegar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [publish]
    if: >-
      !cancelled() && needs.publish.result == 'success' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: desplegar el sitio (público; lee solo el bucket editorial, montado de solo lectura)
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --service-account "$RUNTIME" \
            --add-volume "name=editorial,type=cloud-storage,bucket=${EDITORIAL_BUCKET},readonly=true" \
            --add-volume-mount volume=editorial,mount-path=/editorial \
            --set-env-vars EDITORIAL_DIR=/editorial \
            --min-instances 0 --max-instances 2 --cpu 1 --memory 512Mi \
            --allow-unauthenticated --quiet
      - name: smoke (/ y /cancion.html y una página de canción dan 200; /docs y /dashboard/latest dan 404)
        run: |
          url="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" \
            --region "$REGION" --format='value(status.url)')"
          code() { curl -s -o /dev/null -w '%{http_code}' "${url}$1"; }
          test "$(code /)" = "200"
          test "$(code /cancion.html)" = "200"
          test "$(code /cancion-otra-era.html)" = "200"
          test "$(code /docs)" = "404"
          test "$(code /dashboard/latest)" = "404"
