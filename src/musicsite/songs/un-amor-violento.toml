# Transcripción propia de «Un amor violento» (Los Tres).
# Solo acordes básicos: mayores y menores, sin extensiones (G, Em, C#m; no G7, Dsus4, Am9).
# Se escribe de oído o con una fuente que se declare en [procedencia]. No se copia ningún texto
# de otro sitio. No se publica nada hasta marcar revisado y v2_resuelto.

slug = "un-amor-violento"
titulo = "Un amor violento"
artista = "Los Tres"
tipo = "cancion"
barrio = "Rock"      # Rock, Pop o Indie (vacío si no aplica)

tono = "La mayor"        # por ejemplo "Sol mayor"
cejilla = ""     # por ejemplo "Sin cejilla" o "Cejilla 3"
compas = "4/4"      # por ejemplo "4/4"
bpm = 121          # entre 40 y 240
nivel = "medio"       # inicial, medio o avanzado
acordes = ["A", "B", "E", "Bm", "C#m", "F#m", "G#m"]     # los acordes que usa el tema, por ejemplo ["G", "D", "Em", "C"]

forma = "Intro – Estrofa – Estrofa – Coro – Estrofa – Coro – Interludio – Coro – Final"       # estructura general, por ejemplo "Intro - Estrofa - Coro - Estrofa - Coro - Final"
confianza = "media-alta"   # alta, media o baja
dudas = "La transcripción principal usa A, Bm y E, con variaciones de B y acordes menores en las transiciones. Simplificación de E7 a E. Revisar la duración de los compases del coro y los pasajes instrumentales."       # qué hay que verificar de oído
sin_base_armonica = false   # true en un instrumental sin progresión estable

# Secciones en notación compacta, una por línea: «Nombre xN: acordes». Un acorde por compás;
# «%» repite el compás anterior. Por ejemplo:
#   Intro x1: G D
#   Estrofa x2: G % D Em C
partitura = '''
Intro x2: A B E A
Estrofa x2: A Bm E A
Pre-coro: A Bm E
Coro x2: C#m F#m C#m F#m B A Bm E
Interludio: A Bm E
Puente: B A G#m F#m
Final: A Bm E A
'''

[procedencia]
metodo = "Acordes escritos y validados por el responsable del proyecto (declaración del 2026-10-30), a partir de un boceto V1 preparado con ChatGPT. V2 marcado como resuelto por decisión del responsable; no hay asesoría legal registrada."      # por ejemplo "de oído, con la grabación original"
autor = "Responsable del proyecto (declaración suya)"       # quién transcribió
fecha = "2026-10-30"       # AAAA-MM-DD

[revision]
revisado = true      # true cuando la transcripción está terminada y revisada
v2_resuelto = true   # true solo cuando los derechos (V2) estén resueltos
