dudas = "La tonalidad es tentativa. Verificar las diferencias entre estrofa y coro y la duración de cada acorde."       # qué hay que verificar de oído
sin_base_armonica = false   # true en un instrumental sin progresión estable

# Secciones en notación compacta, una por línea: «Nombre xN: acordes». Un acorde por compás;
# «%» repite el compás anterior. Por ejemplo:
#   Intro x1: G D
#   Estrofa x2: G % D Em C
partitura = '''
Intro x2: E F# B F#
Estrofa x4: E F# B F#
Coro x2: E F# B F#
Corte x2: C#m F#
Interludio x4: E % D#m G#m
Corte x2: C#m F#
Intro: E F# B F#
Coro x2: E F# B F#
Corte x2: C#m F#
Interludio x4: E % D#m G#m
Corte x2: C#m F#
Final (solo): E D#m G#m F#
'''

