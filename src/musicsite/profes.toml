# Quién enseña qué. Perfiles de ejemplo (mock = true) salvo las dos personas que lo aceptaron.
# Cada regla de «ensena» es explícita:
#   { artista = "Los Tres" }                       todos los temas de ese artista
#   { artista = "Los Bunkers", tema = "ven-aqui" } un tema (slug del repertorio)
#   { artista = "*" }                              todo el repertorio
# modo: "linea" y/o "presencial". hoy: disponible hoy. Sin precio: «Precio por definir».

[[profe]]
